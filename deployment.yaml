apiVersion: apps/v1
kind: Deployment

metadata:
  name: demo-app2
  namespace: default

spec:
  replicas: 2

  selector:
    matchLabels:
      app: demo-app2

  template:
    metadata:
      labels:
        app: demo-app2

    spec:
      containers:
        - name: nginx
          image: nginx:latest

          ports:
            - containerPort: 80
